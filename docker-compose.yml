services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD_URL_ENCODED:-${MYSQL_PASSWORD}}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @starter/api migrate && exec pnpm --filter @starter/api start",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/branding').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
    build:
      context: .
      target: web
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  mysql-data:
